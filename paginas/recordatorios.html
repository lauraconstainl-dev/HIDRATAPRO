<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recordatorios - HidrataPro</title>

    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <header>

        <h1>HidrataPro</h1>

        <nav>
            <a href="../index.html">Inicio</a>
            <a href="registro.html">Registro</a>
            <a href="consumo.html">Consumo</a>
            <a href="progreso.html">Progreso</a>
            <a href="recordatorios.html">Recordatorios</a>
        </nav>

    </header>

    <main>

        <section class="recordatorios">

            <h2>Configurar recordatorios</h2>

            <p>
                Elige cada cuánto deseas recibir un recordatorio
                para consumir agua.
            </p>

            <form>

                <label for="intervalo">
                    Intervalo:
                </label>

                <select id="intervalo" name="intervalo">

                    <option value="30">Cada 30 minutos</option>

                    <option value="60">
                        Cada 1 hora
                    </option>

                    <option value="90">
                        Cada 1 hora y 30 minutos
                    </option>

                    <option value="120">
                        Cada 2 horas
                    </option>

                </select>

                <label for="inicio">
                    Hora de inicio:
                </label>

                <input type="time" id="inicio" name="inicio">

                <label for="fin">
                    Hora de finalización:
                </label>

                <input type="time" id="fin" name="fin">

                <button type="submit">
                    Guardar recordatorio
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>HidrataPro © 2026</p>
    </footer>

</body>
</html>
