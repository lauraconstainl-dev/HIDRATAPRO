<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consumo - HidrataPro</title>

    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <header>

        <h1>HidrataPro</h1>

        <nav>
            <a href="../index.html">Inicio</a>
            <a href="registro.html">Registro</a>
            <a href="consumo.html">Consumo</a>
            <a href="progreso.html">Progreso</a>
            <a href="recordatorios.html">Recordatorios</a>
        </nav>

    </header>

    <main>

        <section class="consumo">

            <h2>Registrar consumo de agua</h2>

            <p>Selecciona la cantidad de agua que consumiste.</p>

            <div class="opciones-agua">

                <button type="button">250 ml</button>

                <button type="button">500 ml</button>

                <button type="button">750 ml</button>

                <button type="button">1000 ml</button>

            </div>

            <h3>Ingreso manual</h3>

            <form>

                <label for="cantidad">
                    Cantidad de agua en ml:
                </label>

                <input
                    type="number"
                    id="cantidad"
                    name="cantidad"
                    placeholder="Ejemplo: 600"
                >

                <button type="submit">
                    Registrar consumo
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>HidrataPro © 2026</p>
    </footer>

</body>
</html>
